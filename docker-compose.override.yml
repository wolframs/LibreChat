# Local-only overrides — never modify docker-compose.yml directly.
# - Remap host port 13080 -> container 3080 (Tailscale clients hit :13080).
# - Mount our librechat.yaml for the Ollama custom endpoint.
# - Restart everything unless explicitly stopped, so the stack survives reboots.

services:
  # Nginx fronts the api container, listens externally on 13080,
  # injects the Aleo font (self-hosted) into every HTML response,
  # and rewrites Inter → Aleo in bundled CSS.
  nginx:
    image: nginx:alpine
    container_name: librechat-nginx
    ports:
      - "13080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/fonts:/etc/nginx/fonts:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    # Build from this repo's source (upstream main + local feature edits) instead of
    # pulling the prebuilt registry image. Tagged separately so the registry tag
    # stays untouched for easy rollback.
    image: librechat-fork:local
    build:
      context: .
      dockerfile: Dockerfile
    ports: !reset []
    volumes:
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml
      # NOTE (2026-07-07, upstream sync to ~v0.8.6): the former patch bind-mounts were
      # removed as obsolete now that the image is built from this repo's source:
      # - patches/tx.cjs / tx.es.js — upstream packages/data-schemas/src/methods/tx.ts
      #   now prices claude-opus-4-8 / claude-fable-5 / claude-sonnet-5 natively
      #   (identical values), so the rate-table override is no longer needed.
      # - patches/agents/* (cache-TTL threading) — @librechat/agents >= 3.2.57 supports
      #   `promptCacheTtl` natively; the per-message cache-TTL feature now rides that
      #   option from packages/api source instead of patched node_modules files.
    restart: unless-stopped

  # Not part of this deployment. Without a profile, a bare `docker compose up -d` tries to
  # start it, and it fails the whole command by binding host :3000 (already taken here).
  # Opt in explicitly if ever needed: docker compose --profile admin up -d admin-panel
  admin-panel:
    profiles: ["admin"]

  mongodb:
    # Loopback only. The code-agent sidecar runs as a host process rather than a
    # container — it drives the Claude Code that is already installed and
    # authenticated on this Mac — so it needs a way in that does not exist by
    # default. 127.0.0.1 keeps it off the LAN and off Tailscale.
    ports:
      - "127.0.0.1:27017:27017"
    restart: unless-stopped

  meilisearch:
    restart: unless-stopped

  rag_api:
    restart: unless-stopped

  vectordb:
    restart: unless-stopped

  # Tiny Flask dashboard that reads MongoDB `transactions` and renders a cost page.
  # Internal-only; served at /cost via nginx.
  cost-dashboard:
    build: ./cost-dashboard
    container_name: cost-dashboard
    environment:
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      # Optional. With a Surplus Intelligence buyer key the dashboard settles
      # gateway-routed spend against that gateway's own billing records instead
      # of leaving it priced from the model-name rate table. Unset: everything
      # routed through a profile simply stays flagged nominal.
      - SURPLUS_API_KEY=${SURPLUS_API_KEY:-}
      - SURPLUS_RECONCILE_INTERVAL=${SURPLUS_RECONCILE_INTERVAL:-3600}
    volumes:
      # Read so /cost/markets/endpoints can name the yaml rows that point at a
      # marketplace — the client's market-price button renders only on those.
      - ./librechat.yaml:/app/librechat.yaml:ro
      # The rate table the api bills from, so the market popup measures its
      # discount against the provider's list rather than the marketplace's own
      # (marked-up) reference. See cost-dashboard/listprices.py.
      - ./packages/data-schemas/src/methods/tx.ts:/app/tx.ts:ro
    depends_on:
      - mongodb
    restart: unless-stopped

  # MCP sidecar ("imager" in librechat.yaml) exposing image generation/editing to
  # agents over SSE, backed by OpenRouter and Surplus Intelligence — the model
  # chosen per call decides which. Internal-only; the api container reaches it at
  # http://mcp-image-gen:3013/sse (allow-listed in librechat.yaml -> mcpSettings).
  #
  # It reads the `files` collection and the image bind mounts directly, so a
  # reference image the user uploaded is loaded off disk rather than re-fetched
  # over HTTP. Both mounts must match what the api container writes:
  #   api:  ./images  -> /app/client/public/images   (file records: /images/...)
  #   api:  ./uploads -> /app/uploads                (file records: /uploads/...)
  mcp-image-gen:
    build: ./mcp-image-gen
    container_name: mcp-image-gen
    environment:
      - PORT=3013
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      # Server-wide key: every account on this stack spends on it. The per-user
      # daily limit below, not the key, is what bounds that.
      - OPENROUTER_KEY=${OPENROUTER_KEY:-}
      # Its own Surplus key, not SURPLUS_API_KEY — see .env for why.
      - SURPLUS_IMAGE_KEY=${SURPLUS_IMAGE_KEY:-}
      - IMAGE_GEN_MODELS=${IMAGE_GEN_MODELS:-meta/muse-image}
      - IMAGE_GEN_MODEL=${IMAGE_GEN_MODEL:-meta/muse-image}
      - IMAGE_GEN_API=${IMAGE_GEN_API:-auto}
      - IMAGE_GEN_DAILY_LIMIT=${IMAGE_GEN_DAILY_LIMIT:-3}
      - IMAGE_GEN_COOLDOWN_SEC=${IMAGE_GEN_COOLDOWN_SEC:-30}
    volumes:
      - ./images:/app/images:ro
      - ./uploads:/app/uploads:ro
    expose:
      - "3013"
    depends_on:
      - mongodb
    restart: unless-stopped

  # MCP sidecar giving text-only models ears: it reads an audio file the user
  # uploaded, sends it to an audio-capable model on OpenRouter, and returns the
  # description as text. Internal-only, reached at http://mcp-audio-ears:3014/sse
  # (allow-listed in librechat.yaml -> mcpSettings).
  #
  # This is NOT the same thing as the native audio forwarding in the api image.
  # That sends the file to the model the user is talking to, and only works where
  # that model has ears. This exists for where it doesn't — Claude, Ollama text
  # models, anything on the Anthropic protocol — and for long files, which it
  # splits into chunks the native single-part path cannot.
  #
  # Only the uploads mount is needed: audio never lands in ./images.
  mcp-audio-ears:
    build: ./mcp-audio-ears
    container_name: mcp-audio-ears
    environment:
      - PORT=3014
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      # Same server-wide key and same reasoning as the image sidecar: the per-user
      # limits below, not the key, are what bound who can spend on it.
      - OPENROUTER_KEY=${OPENROUTER_KEY:-}
      - AUDIO_EARS_MODEL=${AUDIO_EARS_MODEL:-google/gemini-3.8-flash}
      - AUDIO_EARS_DAILY_LIMIT=${AUDIO_EARS_DAILY_LIMIT:-20}
      - AUDIO_EARS_COOLDOWN_SEC=${AUDIO_EARS_COOLDOWN_SEC:-5}
      - AUDIO_EARS_TIMEOUT_SEC=${AUDIO_EARS_TIMEOUT_SEC:-600}
    volumes:
      - ./uploads:/app/uploads:ro
    expose:
      - "3014"
    depends_on:
      - mongodb
    restart: unless-stopped

  # Self-hosted SearXNG metasearch, configured to use only the Brave Search API.
  # Internal-only: no host port. The api container reaches it via http://searxng:8080
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped
