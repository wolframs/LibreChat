# Reverse proxy in front of the LibreChat api container.
# Strategy:
#   1. For CSS responses: surgically replace each `font-family:Inter…` value
#      so the bundled stylesheet itself uses Aleo. No specificity war.
#      Replacements are anchored on `font-family:` or surrounding commas, so
#      they never touch substrings inside `pointer-events`, `Inter-Bold.woff2`,
#      `interaction`, etc.
#   2. For HTML responses: inject a self-hosted @font-face <style> block so
#      Aleo loads from our own nginx /fonts/ route — no external CDN dependency.
#   3. Pass through SSE/WebSocket headers + long timeouts for streaming.

server {
    listen 80;
    server_name _;

    # Strip upstream gzip so sub_filter can rewrite bodies.
    proxy_set_header Accept-Encoding "";

    # The switcher script must stay updatable — exempt it from immutable caching.
    location = /fonts/switcher.js {
        alias /etc/nginx/fonts/switcher.js;
        add_header Cache-Control "no-cache";
    }

    # Serve the self-hosted Aleo woff2 files.
    location /fonts/ {
        alias /etc/nginx/fonts/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # Rewrite font-family values inside the bundled CSS files.
    location ~* \.css$ {
        proxy_pass http://api:3080;
        proxy_set_header Host             $host;
        proxy_set_header Accept-Encoding  "";

        sub_filter_once  off;
        sub_filter_types text/css;
        # Rewrite to a CSS variable so the injected font switcher (switcher.js)
        # can restyle the whole app by setting --app-font on <html>.
        sub_filter 'font-family:Inter,sans-serif' 'font-family:var(--app-font,"Aleo",Georgia,Charter,serif)';
        sub_filter 'font-family:Inter}'           'font-family:var(--app-font,"Aleo",Georgia,Charter,serif)}';
        sub_filter ',Inter,'                      ',"Aleo",';
    }

    # Cost dashboard (Flask). Plain proxy, no sub_filter — it has its own font link.
    location /cost {
        proxy_pass http://cost-dashboard:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Export sidecar (same Flask app). Bulk ZIP needs longer timeout + bigger buffer.
    location /export {
        proxy_pass http://cost-dashboard:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering    off;
    }

    location / {
        proxy_pass http://api:3080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        # Must be repeated here: defining any proxy_set_header in a location
        # discards ALL inherited ones, so the server-level strip doesn't apply.
        # Without this, the api returns gzip and sub_filter silently no-ops.
        proxy_set_header Accept-Encoding   "";

        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_read_timeout      600s;
        proxy_send_timeout      600s;
        client_max_body_size    100m;

        # Inject self-hosted @font-face (no external CDN), the --app-font default,
        # and the font-switcher mini UI.
        sub_filter_once on;
        sub_filter '</head>' '<style>@font-face{font-family:"Aleo";font-style:normal;font-weight:300 700;font-display:swap;src:url(/fonts/aleo-normal.woff2) format("woff2")}@font-face{font-family:"Aleo";font-style:italic;font-weight:300 700;font-display:swap;src:url(/fonts/aleo-italic.woff2) format("woff2")}:root{--app-font:"Aleo",Georgia,Charter,serif}body,html{font-family:var(--app-font,"Aleo",Georgia,Charter,serif)!important}</style><script defer src="/fonts/switcher.js?v=3"></script></head>';
    }
}
